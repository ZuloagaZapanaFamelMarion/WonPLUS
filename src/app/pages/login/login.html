<section class="login-container">
  <div class="login-card animate-fade-in">
    <h1 class="login-title">Iniciar sesión</h1>
    <p class="login-subtitle">Ingresa tu correo y contraseña para continuar.</p>

    <form class="login-form" (submit)="onLoginSubmit($event)">
      <div class="form-row">
        <label for="login-email">Correo electrónico</label>
        <input
          type="email"
          id="login-email"
          name="email"
          [(ngModel)]="loginForm.email"
          required
          placeholder="tu@email.com"
          autocomplete="email"
          [class.input-error]="loginErrors.email"
        />
        @if (loginErrors.email) {
          <span class="field-error">{{ loginErrors.email }}</span>
        }
      </div>

      <div class="form-row">
        <label for="login-password">Contraseña</label>
        <input
          type="password"
          id="login-password"
          name="password"
          [(ngModel)]="loginForm.password"
          required
          placeholder="Tu contraseña"
          autocomplete="current-password"
          [class.input-error]="loginErrors.password"
        />
        @if (loginErrors.password) {
          <span class="field-error">{{ loginErrors.password }}</span>
        }
      </div>

      <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
    </form>

    @if (lastEvent()) {
      <div class="event-log" aria-live="polite">
        <p class="event-log-label">Registro de eventos</p>
        <p class="event-log-line">{{ lastEvent() }}</p>
      </div>
    }

    @if (accepted()) {
      <a routerLink="/dashboard" class="btn btn-primary btn-block login-continue">Ir al tablero</a>
    }

    <a routerLink="/" class="login-back">Volver al inicio</a>
  </div>
</section>
